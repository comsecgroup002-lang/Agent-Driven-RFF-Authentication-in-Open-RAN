
data_dir: 'cloud_data'          # 数据存储目录


assistance_mode: 'auto'

# Cloud-side lightweight-guidance variant used for ablations/reproduction.
# rag: retrieval + LLM; llm_only: LLM without retrieved evidence;
# deterministic: top-3 successful-case weighted aggregation without LLM.
guidance_variant: 'rag'

# The LLM is hosted by the cloud coordination service, never by the edge agent.
llm:
  enable: true
  model_path: '/set/your/path/llm_model'
  device_map: 'auto'
  dtype: 'fp16'
  quantization: 'auto'
  max_new_tokens: 400
  offline_mode: true


initial_model:
  weights_path: '/set/your/path/convnext.pth'  # 初始权重路径
  model_config:
    backbone: 'convnext_tiny'
    img_size: 224
    channels_last: true
    pretrained_dir: '/set/your/path/pretrained_models'
    cosface_s: 30.0
    cosface_m: 0.35
  signal_augment:
    retain_ratio: 0.5
    channel_aug_prob: 1.0
    engineering_aug_prob: 0.7
    drift_prob: 0.05
    shift_prob: 0.10
    snr_min_db: 30.0
    snr_max_db: 40.0
  baseline_thresholds:
    - accept_quantile: 0.90
      margin_quantile: 0.20
      rho: 0.0
    - accept_quantile: 0.85
      margin_quantile: 0.15
      rho: 0.05
    - accept_quantile: 0.88
      margin_quantile: 0.25
      rho: -0.05


prior:
  min_samples: 3                # 构建先验所需最小样本数（降低以便快速生效）
  confidence_threshold: 0.7     # 置信度阈值
  interval_expansion: 0.05      # 区间扩展因子


experience_summary:
  max_recent_episodes: 10       # 用于摘要的最近记录数
  include_successful_only: false # 是否只包含成功记录
  include_param_stats: true     # 是否包含参数统计


mismatch:
  mild_threshold: 0.05          # 轻度失配：性能下降 5%
  moderate_threshold: 0.10      # 中度失配：性能下降 10%
  severe_threshold: 0.20        # 严重失配：性能下降 20%
  max_consecutive_failures: 3   # 触发模型重配置的连续失败次数


aggregation:
  enabled: false                # Target-domain model aggregation is disabled
  method: 'disabled'            # Model refresh re-provisions the original source model
  min_contributors: 2           # Retained only for backward-compatible config parsing


objectives:
  min_closed_acc: 0.9
  target_open_auc: 0.85
  max_reject_rate: 0.60          # Auxiliary; feasibility uses only A_c and A_o


server:
  host: '0.0.0.0'
  port: 5000
  debug: false
